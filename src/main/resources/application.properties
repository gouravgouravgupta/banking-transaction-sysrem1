# H2 by default. LOCK_TIMEOUT lets concurrent transfers wait for row locks instead of failing fast.
spring.datasource.url=jdbc:h2:mem:bankdb;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# DB optimization: JDBC batching + ordered writes
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Pool must be > worker threads (each worker can hold 2 connections: main txn + REQUIRES_NEW audit log)
spring.datasource.hikari.maximum-pool-size=20

# Multithreading
bank.batch.threads=8
